<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta property="og:title" content="The Last Light">
<meta property="og:description" content="For a hundred years the lighthouse above Saltmere has never gone dark. Tonight, it will.">
<title>The Last Light</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="An animated story with narration. Part 1 of The Last Light.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one full-screen cinema stage (16:9 canvas, letterboxed), subtitles under the picture, a poster screen on top before play.
   Deliberately single (dark) theme: it is a night-time film. */
:root {
  --night:#05070d; --ink:#eef2fb; --ink2:rgba(238,242,251,.62); --amber:#ffc65c; --sea:#4fd6ff; --mira:#ffd35c; --elias:#8fe3d4;
  --ui:'Outfit', -apple-system, 'Helvetica Neue', system-ui, sans-serif;
  color-scheme:dark;
}
html, body { height:100%; }
body { margin:0; background:var(--night); color:var(--ink); font-family:var(--ui); overflow:hidden; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
#cv { position:fixed; inset:0; width:100%; height:100%; display:block; }
#subs { position:fixed; left:max(16px, env(safe-area-inset-left,0px)); right:max(16px, env(safe-area-inset-right,0px)); text-align:center; pointer-events:none; z-index:3;
  font:600 clamp(17px,2.6vw,30px)/1.32 var(--ui); letter-spacing:-.005em; text-wrap:balance; text-shadow:0 2px 14px rgba(0,0,0,.85), 0 0 2px rgba(0,0,0,.9); }
#subs .who { display:block; font:600 clamp(11px,1.2vw,14px)/1 var(--ui); letter-spacing:.24em; text-transform:uppercase; margin-bottom:8px; opacity:.95; }
#subs .w { display:inline-block; white-space:pre; animation:drop .42s cubic-bezier(.2,.9,.25,1.15) both; }
#subs.n .w { color:var(--ink); }
#subs.e .w { color:#dff8f3; } #subs.e .who { color:var(--elias); }
#subs.m .w { color:#fff3d1; } #subs.m .who { color:var(--mira); }
#subs.out { transition:opacity .35s; opacity:0; }
@keyframes drop { from { opacity:0; transform:translateY(-.6em); filter:blur(6px); } }

/* poster */
#poster { position:fixed; inset:0; z-index:5; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; text-align:center;
  padding-block:24px calc(env(safe-area-inset-bottom,0px) + 9vh); padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px));
  background:linear-gradient(180deg, transparent 35%, rgba(5,7,13,.78) 80%); transition:opacity .9s, visibility .9s; }
#poster.gone { opacity:0; visibility:hidden; }
.kicker { font:500 13px/1 var(--ui); letter-spacing:.34em; text-transform:uppercase; color:var(--amber); }
.ttl { margin:14px 0 0; font:200 clamp(44px,9vw,104px)/.95 var(--ui); letter-spacing:.14em; text-transform:uppercase; text-wrap:balance;
  background:linear-gradient(180deg,#fff 30%,#ffd88a 120%); -webkit-background-clip:text; background-clip:text; color:transparent; }
.logline { max-width:30em; margin:16px auto 0; color:var(--ink2); font:300 clamp(15px,1.8vw,19px)/1.5 var(--ui); }
#play { margin-top:28px; display:inline-flex; align-items:center; gap:12px; height:60px; padding:0 30px 0 24px; border-radius:999px; border:0; cursor:pointer;
  background:#fff; color:#05070d; font:600 18px/1 var(--ui); box-shadow:0 0 0 1px rgba(255,255,255,.2), 0 20px 60px -10px rgba(255,198,92,.55); transition:transform .2s; }
#play:hover { transform:scale(1.03); } #play:active { transform:scale(.97); }
#play:focus-visible, #ctl button:focus-visible { outline:3px solid var(--amber); outline-offset:3px; }
#play svg { width:22px; height:22px; }
#play[disabled] { opacity:.6; cursor:progress; }
.meta { margin-top:14px; color:rgba(238,242,251,.45); font:400 13px/1.4 var(--ui); letter-spacing:.02em; }

/* controls */
#ctl { position:fixed; left:0; right:0; bottom:0; z-index:4; padding:0 max(16px, env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(16px, env(safe-area-inset-left,0px));
  display:flex; align-items:center; gap:14px; opacity:0; transition:opacity .4s; pointer-events:none; }
#ctl.show { opacity:1; pointer-events:auto; }
#ctl button { width:44px; height:44px; flex:none; border-radius:50%; border:0; background:rgba(255,255,255,.14); color:#fff; display:grid; place-items:center; cursor:pointer;
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); }
#ctl button svg { width:20px; height:20px; }
#bar { flex:1; height:4px; border-radius:4px; background:rgba(255,255,255,.18); position:relative; cursor:pointer; touch-action:none; }
#bar::before { content:''; position:absolute; inset:-14px 0; }
#bar i { position:absolute; left:0; top:0; bottom:0; border-radius:4px; background:var(--amber); width:0; }
#time { font:500 13px/1 var(--ui); color:var(--ink2); font-variant-numeric:tabular-nums; min-width:76px; text-align:right; }
#tip { position:fixed; top:calc(env(safe-area-inset-top,0px) + 14px); left:50%; transform:translateX(-50%); z-index:4; font:500 13px var(--ui); color:var(--ink2);
  padding:8px 14px; border-radius:999px; background:rgba(255,255,255,.08); white-space:nowrap; transition:opacity .6s; }
@media (orientation:landscape), (min-width:700px) { #tip { display:none; } }
@media (prefers-reduced-motion: reduce) { #subs .w { animation:none; } }
</style>

<canvas id="cv" aria-label="Animated story: The Last Light"></canvas>
<div id="subs" aria-live="polite"></div>
<div id="tip">Turn your phone sideways for the big screen</div>

<div id="poster">
  <div class="kicker">ilan stories&nbsp;&middot;&nbsp;Part 1</div>
  <h1 class="ttl">The Last Light</h1>
  <p class="logline">For a hundred years the lighthouse above Saltmere has never gone dark. Tonight, it will.</p>
  <button id="play" disabled><svg viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor"/></svg><span id="playT">Loading…</span></button>
  <div class="meta">3 min&nbsp;&middot;&nbsp;narrated&nbsp;&middot;&nbsp;best with sound on</div>
</div>

<div id="ctl">
  <button id="pp" aria-label="Pause"></button>
  <div id="bar" role="slider" aria-label="Story position" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div>
  <span id="time">0:00 / 0:00</span>
</div>

<script>
(() => {
'use strict';
/* ====================== setup ====================== */
const cv = document.getElementById('cv'), g = cv.getContext('2d');
const W = 1600, H = 900;
const subs = document.getElementById('subs');
let TL = null, audio = new Audio(), ready = false, started = false, poster = true;
audio.preload = 'auto';
let stage = { x: 0, y: 0, s: 1, w: 0, h: 0 };
function resize() {
  const dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = Math.round(innerWidth * dpr); cv.height = Math.round(innerHeight * dpr);
  const s = Math.min(innerWidth / W, innerHeight / H);
  stage = { s, w: W * s, h: H * s, x: (innerWidth - W * s) / 2, y: (innerHeight - H * s) / 2, dpr };
  // subtitles: below the picture when there is room (portrait phones), otherwise over its lower part
  const below = innerHeight - (stage.y + stage.h);
  if (below > 110) { subs.style.top = (stage.y + stage.h + 22) + 'px'; subs.style.bottom = 'auto'; }
  else { subs.style.top = 'auto'; subs.style.bottom = (below + stage.h * 0.06 + 40) + 'px'; }
}
addEventListener('resize', resize); resize();

/* ====================== helpers ====================== */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, x) => a + (b - a) * x;
const ss = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
function rnd(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const ev = n => TL.events.find(e => e.name === n).t;
const scene = id => TL.scenes.find(s => s.id === id);
function speaking(who, t) {
  for (const c of TL.cues) if (c.who === who && t >= c.t0 && t <= c.t1) return .35 + .65 * Math.abs(Math.sin(t * 15.7) * Math.sin(t * 6.1 + 1));
  return 0;
}
function talking(who, t) { return TL.cues.some(c => c.who === who && t >= c.t0 - .2 && t <= c.t1 + .3); }
function blink(t, seed) { const p = (t + seed * 1.7) % 4.1; return p < .12 ? 1 - Math.abs(p - .06) / .06 : 0; }
function grad(y0, y1, stops) { const gr = g.createLinearGradient(0, y0, 0, y1); stops.forEach(([o, c]) => gr.addColorStop(o, c)); return gr; }
function rgrad(x, y, r0, r1, stops) { const gr = g.createRadialGradient(x, y, r0, x, y, r1); stops.forEach(([o, c]) => gr.addColorStop(o, c)); return gr; }
function rect(x, y, w, h, c) { g.fillStyle = c; g.fillRect(x, y, w, h); }
function circle(x, y, r, c) { g.beginPath(); g.arc(x, y, r, 0, 7); g.fillStyle = c; g.fill(); }
function ell(x, y, rx, ry, c, rot = 0) { g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, 7); g.fillStyle = c; g.fill(); }
function poly(pts, c) { g.beginPath(); g.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) g.lineTo(pts[i], pts[i + 1]); g.closePath(); g.fillStyle = c; g.fill(); }
function rr(x, y, w, h, r, c) { g.beginPath(); g.roundRect(x, y, w, h, r); g.fillStyle = c; g.fill(); }
// camera: put world point (cx,cy) at the centre with zoom z, plus shake
let shake = 0;
function cam(cx, cy, z) { const sx = shake ? (Math.random() - .5) * shake : 0, sy = shake ? (Math.random() - .5) * shake : 0; g.translate(W / 2 + sx, H / 2 + sy); g.scale(z, z); g.translate(-cx, -cy); }

/* ====================== world pieces ====================== */
const STARS = (() => { const r = rnd(4); return Array.from({ length: 260 }, () => ({ x: r() * 2400 - 400, y: r() * 620 - 100, s: r() * 1.6 + .3, p: r() * 6 })); })();
function sky(t, top, mid, bot, stars = 1, yTop = -400, yBot = 760) {
  g.fillStyle = grad(yTop, yBot, [[0, top], [.6, mid], [1, bot]]); g.fillRect(-800, yTop, W + 1600, yBot - yTop + 400);
  if (stars) STARS.forEach(s => { g.globalAlpha = stars * (.45 + .55 * Math.sin(t * 1.3 + s.p) ** 2); circle(s.x, s.y, s.s, '#fff'); });
  g.globalAlpha = 1;
}
function moon(x, y, r, a = 1) {
  g.globalAlpha = a;
  circle(x, y, r * 4, 'rgba(180,200,255,.05)'); circle(x, y, r * 2, 'rgba(200,215,255,.08)');
  circle(x, y, r, '#eef1ff'); circle(x - r * .3, y - r * .2, r * .22, 'rgba(160,170,200,.35)'); circle(x + r * .35, y + r * .3, r * .14, 'rgba(160,170,200,.3)');
  g.globalAlpha = 1;
}
function sea(t, y0, cols, rough = 1, x0 = -900, x1 = W + 900, reflectX = null) {
  for (let L = 0; L < cols.length; L++) {
    const yy = y0 + L * 34 * (1 + L * .4), amp = (6 + L * 5) * rough, k = .006 - L * .0009, sp = (.6 + L * .25) * (rough > 1.5 ? 2 : 1);
    g.beginPath(); g.moveTo(x0, H + 600);
    for (let x = x0; x <= x1; x += 20) g.lineTo(x, yy + Math.sin(x * k + t * sp + L) * amp + Math.sin(x * k * 2.3 - t * sp * .7) * amp * .4);
    g.lineTo(x1, H + 600); g.closePath(); g.fillStyle = cols[L]; g.fill();
    if (reflectX != null && L < 2) { // moon / beam glints
      g.globalAlpha = .35 - L * .12;
      for (let i = 0; i < 9; i++) { const w = 70 - i * 6 + Math.sin(t * 2 + i) * 10; rr(reflectX - w / 2 + Math.sin(t + i * 2) * 12, yy + 8 + i * 9, w, 2.5, 2, '#dfe8ff'); }
      g.globalAlpha = 1;
    }
  }
}
function cliff(x, y, w, h, c) { poly([x, y + h, x, y + 30, x + w * .12, y + 6, x + w * .3, y, x + w * .62, y + 4, x + w * .85, y + 18, x + w, y + 60, x + w + 40, y + h], c); }
// lighthouse: base centre (x,y), height h. Returns lamp point.
function lighthouse(x, y, h, lamp, t, dusk = 0) {
  const w0 = h * .2, w1 = h * .13, top = y - h;
  // tower body with stripes
  g.save(); g.beginPath(); g.moveTo(x - w0 / 2, y); g.lineTo(x - w1 / 2, top); g.lineTo(x + w1 / 2, top); g.lineTo(x + w0 / 2, y); g.closePath(); g.clip();
  for (let i = 0; i < 6; i++) rect(x - w0, top + i * h / 6, w0 * 2, h / 6 + 1, i % 2 ? '#a83a3f' : '#d9d3c7');
  const sh = g.createLinearGradient(x - w0 / 2, 0, x + w0 / 2, 0);
  sh.addColorStop(0, 'rgba(10,14,30,.15)'); sh.addColorStop(.45, 'rgba(255,255,255,.06)'); sh.addColorStop(1, 'rgba(5,8,20,.72)'); g.fillStyle = sh; g.fillRect(x - w0, top, w0 * 2, h);
  g.fillStyle = `rgba(8,12,30,${.45 - dusk * .25})`; g.fillRect(x - w0, top, w0 * 2, h);
  // little windows
  for (let i = 1; i < 5; i++) rr(x - 5, top + i * h / 5.2, 10, 16, 4, lamp > .1 ? `rgba(255,205,120,${.35 + .4 * lamp})` : '#1a2134');
  g.restore();
  // gallery + lamp room + dome
  rect(x - w1 * .85, top - 8, w1 * 1.7, 9, '#1b2032'); for (let i = -5; i <= 5; i++) rect(x + i * w1 * .16 - 1, top - 30, 2.5, 22, '#232a3f'); rect(x - w1 * .85, top - 32, w1 * 1.7, 4, '#232a3f');
  const lr = top - 30, lh = h * .12, lw = w1 * .95;
  rect(x - lw / 2, lr - lh, lw, lh, lamp > .05 ? `rgba(255,${200 + 40 * lamp},${130 + 80 * lamp},${.25 + .75 * lamp})` : '#141a2c');
  for (let i = -1; i <= 1; i++) rect(x + i * lw / 3 - 1.5, lr - lh, 3, lh, '#20263a');
  poly([x - lw * .62, lr - lh, x, lr - lh - h * .09, x + lw * .62, lr - lh], '#6e2329'); rect(x - 1.5, lr - lh - h * .09 - 18, 3, 18, '#20263a');
  return { x, y: lr - lh / 2 };
}
// rotating beam from lamp. phase in radians; a = strength
function beam(lx, ly, ph, a, len = 1500) {
  if (a <= 0) return;
  const dx = Math.cos(ph), facing = Math.max(0, Math.sin(ph));
  g.save(); g.globalCompositeOperation = 'lighter';
  const L = len * (.25 + .75 * Math.abs(dx)), hw = 26 + 70 * (1 - Math.abs(dx));
  const gr = g.createLinearGradient(lx, ly, lx + dx * L, ly);
  gr.addColorStop(0, `rgba(255,236,180,${.55 * a})`); gr.addColorStop(1, 'rgba(255,236,180,0)');
  g.fillStyle = gr; g.beginPath(); g.moveTo(lx, ly - 8); g.lineTo(lx + dx * L, ly - hw); g.lineTo(lx + dx * L, ly + hw); g.lineTo(lx, ly + 8); g.closePath(); g.fill();
  g.fillStyle = rgrad(lx, ly, 0, 60 + 220 * facing, [[0, `rgba(255,244,210,${a * (.6 + .4 * facing)})`], [.3, `rgba(255,220,140,${a * .25 * (.4 + facing)})`], [1, 'rgba(255,200,120,0)']]);
  g.fillRect(lx - 300, ly - 300, 600, 600);
  g.restore();
}
function glowAt(x, y, r, col, a) { g.save(); g.globalCompositeOperation = 'lighter'; g.fillStyle = rgrad(x, y, 0, r, [[0, col.replace('A', a)], [1, col.replace('A', 0)]]); g.fillRect(x - r, y - r, r * 2, r * 2); g.restore(); }
// rain streaks
const DROPS = (() => { const r = rnd(9); return Array.from({ length: 420 }, () => ({ x: r() * 2200 - 300, y: r() * 1200 - 200, v: .8 + r() * .6, l: 16 + r() * 26 })); })();
function rainFx(t, a = 1, slant = .22) {
  g.save(); g.strokeStyle = `rgba(190,210,255,${.32 * a})`; g.lineWidth = 1.6; g.beginPath();
  DROPS.forEach(d => { const y = ((d.y + t * 1500 * d.v) % 1250) - 200, x = d.x - (y + 200) * slant; g.moveTo(x, y); g.lineTo(x - d.l * slant, y + d.l); });
  g.stroke(); g.restore();
}
function flash(t, times, dur = .5) { let a = 0; times.forEach(t0 => { const d = t - t0; if (d >= 0 && d < dur) a = Math.max(a, (d < .06 ? 1 : d < .12 ? .25 : d < .2 ? .8 : 1 - d / dur) * .85); }); return a; }

/* ====================== characters ====================== */
// Mira: yellow raincoat, dark bob. (x,y) = feet. s = scale (1 ≈ 300px tall). o = {mouth, blink, look, lantern, arm, smile, back}
function mira(x, y, s, o = {}) {
  g.save(); g.translate(x, y); g.scale(s, s);
  const bob = o.walk ? Math.abs(Math.sin(o.walk * 7)) * 6 : 0; g.translate(0, -bob);
  // legs + boots
  const lw = o.walk ? Math.sin(o.walk * 7) * 10 : 0;
  rr(-24 + lw, -70, 18, 62, 8, '#26314f'); rr(6 - lw, -70, 18, 62, 8, '#26314f');
  rr(-30 + lw, -14, 30, 16, 7, '#c2412f'); rr(2 - lw, -14, 30, 16, 7, '#c2412f');
  // coat
  g.beginPath(); g.moveTo(-34, -190); g.quadraticCurveTo(-58, -110, -62, -62); g.lineTo(62, -62); g.quadraticCurveTo(58, -110, 34, -190); g.closePath();
  g.fillStyle = grad(-200, -60, [[0, '#ffd75e'], [1, '#f2a91c']]); g.fill();
  rect(-2, -186, 4, 120, 'rgba(140,80,0,.35)'); [-160, -130, -100].forEach(yy => circle(10, yy, 4, '#9a5d08'));
  g.fillStyle = 'rgba(120,60,0,.18)'; g.beginPath(); g.moveTo(10, -190); g.quadraticCurveTo(50, -120, 62, -62); g.lineTo(20, -62); g.closePath(); g.fill();
  // arms
  const arm = o.arm || 0;
  g.save(); g.translate(-36, -178); g.rotate(.18 + (o.armL || 0)); rr(-12, 0, 22, 88, 11, '#f5b62c'); circle(-1, 90, 11, '#f1c29a'); g.restore();
  g.save(); g.translate(36, -178); g.rotate(-.18 - arm); rr(-10, 0, 22, 88, 11, '#eaa51e'); circle(1, 90, 11, '#f1c29a');
  if (o.lantern) { g.translate(1, 100); lanternDraw(o.lantern); } g.restore();
  // head
  g.translate(0, -238 + (o.lookUp ? -4 : 0));
  if (o.back) { circle(0, 0, 50, '#2a1d1a'); rr(-52, -6, 104, 52, 22, '#2a1d1a'); g.restore(); return; }
  circle(0, 4, 46, '#f1c29a');
  // hair: bob + fringe
  g.fillStyle = '#2a1d1a'; g.beginPath(); g.arc(0, -2, 52, Math.PI * .95, Math.PI * 2.05); g.lineTo(54, 30); g.quadraticCurveTo(46, 44, 36, 40); g.lineTo(38, 2);
  g.quadraticCurveTo(10, -16, -22, -8); g.quadraticCurveTo(-36, 0, -38, 4); g.lineTo(-36, 40); g.quadraticCurveTo(-46, 44, -54, 30); g.closePath(); g.fill();
  circle(-30, 18, 7, 'rgba(255,120,110,.28)'); circle(30, 18, 7, 'rgba(255,120,110,.28)');
  const lk = o.look || 0, bl = o.blink || 0;
  [-16, 16].forEach(ex => { if (bl > .5) rect(ex - 7 + lk, 6, 14, 3, '#2a1d1a'); else { ell(ex + lk, 7, 6.5, 8 * (1 - bl), '#241816'); circle(ex + lk + 2, 4, 2.2, '#fff'); } });
  if (o.scared) { g.strokeStyle = '#2a1d1a'; g.lineWidth = 3; g.beginPath(); g.moveTo(-24, -9); g.lineTo(-9, -5); g.moveTo(24, -9); g.lineTo(9, -5); g.stroke(); }
  const m = o.mouth || 0;
  if (m > .05) ell(0, 27, 7, 3 + 8 * m, '#7a2e2e');
  else { g.strokeStyle = '#7a2e2e'; g.lineWidth = 3; g.lineCap = 'round'; g.beginPath(); if (o.smile) g.arc(0, 20, 9, .2, Math.PI - .2); else { g.moveTo(-6, 27); g.lineTo(6, 27); } g.stroke(); }
  g.restore();
}
function lanternDraw(a) {
  rect(-2, -6, 4, 10, '#333'); rr(-14, 2, 28, 34, 6, '#3a2f22'); rr(-10, 6, 20, 26, 4, `rgba(255,${190 + 50 * a},110,${.6 + .4 * a})`);
  glowAt(0, 18, 120, 'rgba(255,190,90,A)', .55 * a);
}
// Elias: tall, navy coat, white beard, cap. o = {mouth, blink, wet, eyes(0..1 blue glow), lantern, look}
function elias(x, y, s, o = {}) {
  g.save(); g.translate(x, y); g.scale(s, s);
  const coat = o.wet ? ['#1a2c44', '#0e1a2c'] : ['#2b3a5c', '#1a2440'];
  rr(-28, -80, 22, 76, 8, '#1b1f2b'); rr(6, -80, 22, 76, 8, '#1b1f2b'); rr(-34, -12, 32, 14, 6, '#111'); rr(4, -12, 32, 14, 6, '#111');

// 10. figure: rocks at the base, someone walks out of the waves; Mira small in the window above

// 11. twist: close-ups, shot / reverse. Elias soaked with glowing eyes; the boom turns everything blue

// 12. hand: Mira looks at her palm in the flickering beam; it starts glowing blue
SC.hand = (lt, t, d) => {
  const gl = ss(ev('glow'), ev('glow') + 2.5, t);

  [[-118, -190, 46, 190, -.2], [-48, -260, 48, 250, -.05], [22, -270, 48, 260, .03], [86, -220, 44, 210, .14]].forEach(([x, y, w, h, r]) => { g.save(); g.rotate(r); rr(x, y, w, h, 24, '#e8b993'); g.restore(); });

  g.strokeStyle = 'rgba(150,90,60,.35)'; g.lineWidth = 4; g.beginPath(); g.moveTo(-90, 70); g.quadraticCurveTo(0, 30, 100, 60); g.moveTo(-100, 140); g.quadraticCurveTo(-20, 110, 60, 170); g.stroke();

    g.save(); g.lineCap = 'round'; g.lineJoin = 'round'; g.shadowColor = 'rgba(80,220,255,.9)'; g.shadowBlur = 14;

// 13. end card

/* ====================== player ====================== */
function render(t) {
  g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = '#05070d'; g.fillRect(0, 0, cv.width, cv.height);
  if (!TL) return;
  g.setTransform(stage.s * stage.dpr, 0, 0, stage.s * stage.dpr, stage.x * stage.dpr, stage.y * stage.dpr);
  g.save(); g.beginPath(); g.rect(0, 0, W, H); g.clip();
  const sIdx = Math.max(0, TL.scenes.findIndex(s => t >= s.t0 && t < s.t1));
  const S = TL.scenes[sIdx === -1 ? TL.scenes.length - 1 : sIdx] || TL.scenes[TL.scenes.length - 1];
  const draw = (sc, alpha) => { g.save(); g.globalAlpha = 1; SC[sc.id](t - sc.t0, t, sc.t1 - sc.t0); g.restore(); if (alpha < 1) { /* handled by overlay */ } };
  draw(S, 1);
  // cross-fade from black at each cut (short dip), hard cut into the storm and the twist
  const hard = { storm: 1, twist: 1, end: 0 };
  const sinceCut = t - S.t0, toCut = S.t1 - t;
  let dip = 0; if (!hard[S.id]) dip = Math.max(0, 1 - sinceCut / .55);
  const nxt = TL.scenes[TL.scenes.indexOf(S) + 1]; if (nxt && !hard[nxt.id]) dip = Math.max(dip, 1 - toCut / .45);
  if (t < .01 && !poster) dip = 1;
  if (poster) dip = 0;
  if (dip > 0) { g.fillStyle = `rgba(3,4,8,${dip})`; g.fillRect(0, 0, W, H); }
  // film grain
  g.globalAlpha = .045; for (let i = 0; i < 70; i++) rect(Math.random() * W, Math.random() * H, 2, 2, Math.random() < .5 ? '#fff' : '#000'); g.globalAlpha = 1;
  g.restore();
}
// subtitles: words drop in one by one at the moment they are spoken
let curCue = null, shownWords = 0;
function updSubs(t) {
  const c = TL.cues.find(c => t >= c.t0 - .05 && t <= c.t1 + .6);
  if (c !== curCue) {
    curCue = c; shownWords = 0; subs.className = c ? c.who.toLowerCase() : ''; subs.innerHTML = '';
    if (c) { if (c.who !== 'N') { const w = document.createElement('span'); w.className = 'who'; w.textContent = c.who === 'E' ? 'Elias' : 'Mira'; subs.appendChild(w); } }
  }
  if (!c) return;
  if (t > c.t1 + .25) subs.classList.add('out');
  const words = c.text.split(' '), total = c.text.length;
  let acc = 0, want = 0;
  for (let i = 0; i < words.length; i++) { const at = c.t0 + (c.t1 - c.t0) * (acc / total) * .96; if (t >= at) want = i + 1; acc += words[i].length + 1; }
  while (shownWords < want) { const s = document.createElement('span'); s.className = 'w'; s.textContent = words[shownWords] + (shownWords < words.length - 1 ? ' ' : ''); subs.appendChild(s); shownWords++; }
}
// smooth clock (Safari updates currentTime in steps)
let lastA = 0, lastP = 0;
function clock() {
  const a = audio.currentTime, now = performance.now();
  if (audio.paused) { lastA = a; lastP = now; return a; }
  if (a !== lastA) { lastA = a; lastP = now; return a; }
  return Math.min(a + (now - lastP) / 1000, a + .3);
}
const ppBtn = document.getElementById('pp'), barI = document.querySelector('#bar i'), timeEl = document.getElementById('time'), ctl = document.getElementById('ctl');
const ICON_PAUSE = '<svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.2" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.2" fill="currentColor"/></svg>';
const ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor"/></svg>';
const ICON_AGAIN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg>';
const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
let hideT = 0;
function poke() { ctl.classList.add('show'); clearTimeout(hideT); if (!audio.paused) hideT = setTimeout(() => ctl.classList.remove('show'), 2600); }
function frame() {
  const t = TL ? Math.min(clock(), TL.total) : 0;
  render(started ? t : posterT());
  if (started && TL) {
    updSubs(t);
    barI.style.width = (t / TL.total * 100) + '%'; timeEl.textContent = fmt(t) + ' / ' + fmt(TL.total);
    document.getElementById('bar').setAttribute('aria-valuenow', Math.round(t / TL.total * 100));
  }
  requestAnimationFrame(frame);
}
// poster shows a living frame of the title scene (beam sweeping), without the title text
const p0 = performance.now(); function posterT() { return 1 + (performance.now() - p0) / 1000; }   // title scene clock, sky keeps moving
function setPP() { ppBtn.innerHTML = audio.ended ? ICON_AGAIN : audio.paused ? ICON_PLAY : ICON_PAUSE; ppBtn.setAttribute('aria-label', audio.ended ? 'Watch again' : audio.paused ? 'Play' : 'Pause'); }
ppBtn.onclick = e => { e.stopPropagation(); if (audio.ended) { audio.currentTime = 0; curCue = null; } audio.paused || audio.ended ? audio.play() : audio.pause(); };
audio.addEventListener('play', () => { setPP(); poke(); }); audio.addEventListener('pause', () => { setPP(); poke(); }); audio.addEventListener('ended', () => { setPP(); ctl.classList.add('show'); });
cv.addEventListener('click', () => { if (!started) return; if (ctl.classList.contains('show') || audio.paused) { audio.paused ? audio.play() : audio.pause(); } poke(); });
addEventListener('pointermove', () => { if (started) poke(); });
addEventListener('keydown', e => { if (!started) return; if (e.code === 'Space') { e.preventDefault(); audio.paused ? audio.play() : audio.pause(); } if (e.key === 'ArrowRight') audio.currentTime += 5; if (e.key === 'ArrowLeft') audio.currentTime -= 5; poke(); });
const bar = document.getElementById('bar');
function seek(e) { const r = bar.getBoundingClientRect(); audio.currentTime = clamp((e.clientX - r.left) / r.width) * TL.total; curCue = null; poke(); }
bar.addEventListener('pointerdown', e => { e.stopPropagation(); bar.setPointerCapture(e.pointerId); seek(e); bar.onpointermove = seek; });
bar.addEventListener('pointerup', () => { bar.onpointermove = null; });
document.getElementById('play').onclick = async () => {
  if (!ready) return;
  started = true; poster = false; document.getElementById('poster').classList.add('gone');
  const tip = document.getElementById('tip'); setTimeout(() => tip.style.opacity = 0, 3500);
  try { await audio.play(); } catch (e) { setPP(); ctl.classList.add('show'); }
  try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => {}); } catch (e) {}
};
// load timeline + soundtrack
(async () => {
  try {
    TL = await (await fetch('timeline.json')).json();
    const blob = await (await fetch('story.mp4')).blob();
    audio.src = URL.createObjectURL(blob);
    await document.fonts.ready;
    ready = true; const b = document.getElementById('play'); b.disabled = false; document.getElementById('playT').textContent = 'Play story';
  } catch (e) { document.getElementById('playT').textContent = 'Could not load. Refresh to try again.'; }
})();
window.__story = { seekTo: s => { audio.currentTime = s; curCue = null; }, get t() { return audio.currentTime; }, renderAt: s => { started = true; poster = false; document.getElementById('poster').classList.add('gone'); render(s); updSubs(s); } };
requestAnimationFrame(frame);
})();
